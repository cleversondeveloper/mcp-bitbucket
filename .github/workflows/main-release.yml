name: main-release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  CI_PYTHON_POETRY_TAG: "0.1.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Define next SEMVER from changelog
        id: semver
        run: |
          CI_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ci-python-poetry:${{ env.CI_PYTHON_POETRY_TAG }}"
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$CI_IMAGE" \
            python /opt/ci-python-poetry/scripts/define_next_semver.py \
            --changelog CHANGELOG.md \
            --output-file .github_release_vars
          cat .github_release_vars >> "$GITHUB_OUTPUT"

      - name: Mark changelog version as RELEASED
        run: |
          CI_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ci-python-poetry:${{ env.CI_PYTHON_POETRY_TAG }}"
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$CI_IMAGE" \
            python /opt/ci-python-poetry/scripts/mark_changelog_released.py \
            --version "${{ steps.semver.outputs.version }}" \
            --changelog CHANGELOG.md

      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore(release): mark v${{ steps.semver.outputs.version }} as RELEASED"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  dockerhub:
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-bitbucket
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE_REPO }}:latest
